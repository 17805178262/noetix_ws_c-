# 上层关节坐标映射：q_joint = direction * q_actuator + offset，offset单位为弧度。
# 与Bumi系列一致，物理电机标定单独配置在hardware.yaml的actuator_list中。
# 当前方向修正已迁移到hardware.yaml；此处保持恒等映射，避免同一方向重复应用。
