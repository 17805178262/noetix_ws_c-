# 此处定义物理电机标定、通信拓扑和底层运行选项。
hardware:
  # Keep true for the first powered-up feedback/IMU verification.
  # After checking all joint directions and emergency stop, set false to enable motion.
  diagnostic_read_only: false
# 物理电机标定：反馈q_actuator = direction * q_raw + bias，bias单位为弧度。
# direction沿用本次迁移前robot.yaml中的配置；以后在此调整物理电机方向。
# 并联踝的这四个条目作用在真实电机上，先完成标定再进行FK/雅可比解算。
actuator_list:
- name: waist_yaw_joint
  direction: 1
  bias: 0.0
- name: head_pitch_joint
  direction: 1
  bias: 0.0
- name: head_yaw_joint
  direction: 1
  bias: 0.0
- name: l_arm_pitch_joint
  direction: 1
  bias: 0.0
- name: l_arm_roll_joint
  direction: -1
  bias: 0.0
- name: l_arm_yaw_joint
  direction: -1
  bias: 0.0
- name: l_elbow_pitch_joint
  direction: -1
  bias: 0.0
- name: l_hand_yaw_joint
  direction: -1
  bias: 0.0
- name: l_hand_pitch_joint
  direction: -1
  bias: 0.0
- name: l_hand_roll_joint
  direction: 1
  bias: 0.0
- name: r_arm_pitch_joint
  direction: -1
  bias: 0.0
- name: r_arm_roll_joint
  direction: -1
  bias: 0.0
- name: r_arm_yaw_joint
  direction: -1
  bias: 0.0
- name: r_elbow_pitch_joint
  direction: 1
  bias: 0.0
- name: r_hand_yaw_joint
  direction: 1
  bias: 0.0
- name: r_hand_pitch_joint
  direction: 1
  bias: 0.0
- name: r_hand_roll_joint
  direction: 1
  bias: 0.0
- name: l_hip_pitch_joint
  direction: 1
  bias: 0.0
- name: l_hip_roll_joint
  direction: 1
  bias: 0.0
- name: l_hip_yaw_joint
  direction: -1
  bias: 0.0
- name: l_knee_pitch_joint
  direction: 1
  bias: 0.0
- name: l_ankle_pitch_joint
  direction: 1
  bias: 0.0
- name: l_ankle_roll_joint
  direction: -1
  bias: 0.0
- name: r_hip_pitch_joint
  direction: -1
  bias: 0.0
- name: r_hip_roll_joint
  direction: 1
  bias: 0.0
- name: r_hip_yaw_joint
  direction: -1
  bias: 0.0
- name: r_knee_pitch_joint
  direction: -1
  bias: 0.0
- name: r_ankle_pitch_joint
  direction: -1
  bias: 0.0
- name: r_ankle_roll_joint
  direction: 1
  bias: 0.0
ethercat:
  ifname: eno1
  bind_cpu: 9
  rt_priority: 90
  enable_dc: true
  cycle_time_ns: 1000000
canu_network:             # CANU通信网络，请根据实机连接情况配置
  - name: body            # CANU索引名字
    ecat_id: 1            # CANU在EtherCAT网络中的ID，从主站开始，第一个从站ID为1，依次增加
    enable: true          # 使能该CANU
    imu:
      name: imu_hip          # IMU 设备名称
    channel_1:            # CANU的CTRL-1通道配置
      - name: waist_yaw_joint            
        type: ACTR_8522               
        can_id: 1                       
    channel_2:            
      - name: l_arm_pitch_joint   
        type: ACTR_5014                  
        can_id: 1                           
      - name: l_arm_roll_joint   
        type: ACTR_5014                 
        can_id: 2                             
      - name: l_arm_yaw_joint   
        type: ACTR_5014                  
        can_id: 3                            
      - name: l_elbow_pitch_joint   
        type: ACTR_5014                  
        can_id: 4 
      - name: l_hand_yaw_joint   
        type: ACTR_4308                 
        can_id: 5                             
      - name: l_hand_pitch_joint   
        type: ACTR_4308                  
        can_id: 7                            
      - name: l_hand_roll_joint   
        type: ACTR_4308                   
        can_id: 6   
    channel_3:            
      - name: l_hip_pitch_joint    
        type: ACTR_8522                  
        can_id: 1                             
      - name: l_hip_roll_joint    
        type: ACTR_8522              
        can_id: 2                             
      - name: l_hip_yaw_joint    
        type: ACTR_8522                   
        can_id: 3                             
      - name: l_knee_pitch_joint   
        type: ACTR_8522                 
        can_id: 4                             
      - name: l_ankle_pitch_joint    
        type: ACTR_5014                  
        can_id: 5                            
      - name: l_ankle_roll_joint    
        type: ACTR_5014                   
        can_id: 6 

  - name: hip             
    ecat_id: 2             
    enable: true  
    channel_1:            
      - name: r_hip_pitch_joint    
        type: ACTR_8522                  
        can_id: 1                             
      - name: r_hip_roll_joint    
        type: ACTR_8522              
        can_id: 2                             
      - name: r_hip_yaw_joint    
        type: ACTR_8522                   
        can_id: 3                             
      - name: r_knee_pitch_joint   
        type: ACTR_8522                 
        can_id: 4                             
      - name: r_ankle_pitch_joint    
        type: ACTR_5014                  
        can_id: 5                            
      - name: r_ankle_roll_joint    
        type: ACTR_5014                   
        can_id: 6                      
    channel_2:            
      - name: r_arm_pitch_joint   
        type: ACTR_5014                  
        can_id: 1                           
      - name: r_arm_roll_joint   
        type: ACTR_5014                 
        can_id: 2                             
      - name: r_arm_yaw_joint   
        type: ACTR_5014                  
        can_id: 3                            
      - name: r_elbow_pitch_joint   
        type: ACTR_5014                  
        can_id: 4 
      - name: r_hand_yaw_joint   
        type: ACTR_4308                 
        can_id: 5                             
      - name: r_hand_pitch_joint   
        type: ACTR_4308                  
        can_id: 7                            
      - name: r_hand_roll_joint   
        type: ACTR_4308                   
        can_id: 6                             
    channel_3:            
      - name: head_pitch_joint    
        type: ACTR_4308                  
        can_id: 1                             
      - name: head_yaw_joint    
        type: ACTR_4308                  
        can_id: 2